kind = "web"
previewPath = "/luxury-cars/"
title = "Luxury Car Dealership"
version = "1.0.0"
id = "artifacts/luxury-cars"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/luxury-cars/" ]
localPort = 18438

[services.development]
run = "pnpm --filter @workspace/luxury-cars run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/luxury-cars", "run", "build" ]
publicDir = "artifacts/luxury-cars/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18438"
BASE_PATH = "/luxury-cars/"
